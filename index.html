    <!-- Google Analytics 4, loaded after the page has painted.
         gtag.js is 166KB of third-party JavaScript. Loading it from <head>
         put it in the critical path, where it cost roughly 1.4s of mobile LCP
         on a throttled connection (measured: median LCP 2,900ms with it,
         1,504ms without).

         The dataLayer queue and the config call still run immediately, so the
         pageview is recorded with its real timestamp - gtag.js processes the
         queued calls once it arrives. Only the network fetch is deferred, so
         no data is lost. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R6F5VRMRGQ');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-R6F5VRMRGQ';
          document.head.appendChild(s);
        }
        function schedule() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadGtag, { timeout: 3000 });
          } else {
            setTimeout(loadGtag, 1200);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        // A visitor who leaves before load fires still gets counted.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') loadGtag();
        });
      })();
    </script>
